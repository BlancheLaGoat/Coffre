<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Coffre</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Coffre</h1>
      <nav class="tabs" id="tabs" role="tablist">
        <button role="tab" data-tab="fm"><span class="k fm-k">◆</span> <span class="long">Cartes </span>FM <span class="count" id="tabFmCount"></span></button>
        <button role="tab" data-tab="ygo"><span class="k ygo-k">★</span> Yu-Gi-Oh <span class="count" id="tabYgoCount"></span></button>
        <button role="tab" data-tab="op"><span class="k op-k">☠</span> One Piece <span class="count" id="tabOpCount"></span></button>
        <button role="tab" data-tab="vin"><span class="k vin-k">●</span> Vinyles <span class="count" id="tabVinCount"></span></button>
      </nav>
    </div>
    <div class="top-right">
      <div class="update" id="updateBar" hidden></div>
      <span class="saved" id="savedState"></span>
      <button class="icon-btn" id="settingsBtn" title="Réglages" aria-label="Réglages">⚙</button>
    </div>
  </header>

  <main class="shelves" id="shelves" data-tab="fm">
    <!-- ===== CARTES FM ===== -->
    <section class="shelf fm">
      <div class="shelf-head">
        <div class="title-row">
          <h2><span class="k">◆</span> Forbidden Memories</h2>
          <span class="big"><b id="fmOwned">0</b> / 722 · <span id="fmCopies">0</span> exemplaires</span>
        </div>
        <div class="bar"><i id="fmBar"></i></div>
        <div class="tools">
          <input type="search" id="fmSearch" placeholder="Nom, n° ou mot de passe…" aria-label="Rechercher une carte">
          <button id="fmWishBtn" title="Copier les cartes manquantes au format wishlist Cardmarket">Wishlist Cardmarket</button>
          <select id="fmType" aria-label="Type de carte">
            <option value="">Tous les types</option>
            <option value="M">Monstres</option>
            <option value="G">Magies</option>
            <option value="E">Équipements</option>
            <option value="F">Terrains</option>
            <option value="R">Rituels</option>
            <option value="T">Pièges</option>
          </select>
          <div class="seg" id="fmLayout">
            <button data-v="gal">Galerie</button>
            <button data-v="list">Liste</button>
          </div>
          <div class="seg" id="fmView">
            <button data-v="all" aria-pressed="true">Toutes</button>
            <button data-v="own">Possédées</button>
            <button data-v="miss">Manquantes</button>
            <button data-v="dup">Doubles</button>
          </div>
        </div>
      </div>
      <div class="list" id="fmList"></div>
    </section>

    <!-- ===== YU-GI-OH (toutes les cartes du jeu) ===== -->
    <section class="shelf ygo tcg">
      <div class="shelf-head">
        <div class="title-row">
          <h2><span class="k">★</span> Yu-Gi-Oh</h2>
          <span class="big" id="ygoStats"></span>
        </div>
        <div class="tools">
          <div class="seg" id="ygoView">
            <button data-v="col">Ma collection</button>
            <button data-v="decks">Decks</button>
            <button data-v="wish">Wishlist</button>
          </div>
        </div>
        <div class="tools" id="ygoTools"></div>
      </div>
      <div class="list" id="ygoList"></div>
    </section>

    <!-- ===== ONE PIECE (toutes les cartes du jeu) ===== -->
    <section class="shelf op tcg">
      <div class="shelf-head">
        <div class="title-row">
          <h2><span class="k">☠</span> One Piece</h2>
          <span class="big" id="opStats"></span>
        </div>
        <div class="tools">
          <div class="seg" id="opView">
            <button data-v="col">Ma collection</button>
            <button data-v="decks">Decks</button>
            <button data-v="wish">Wishlist</button>
          </div>
        </div>
        <div class="tools" id="opTools"></div>
      </div>
      <div class="list" id="opList"></div>
    </section>

    <!-- ===== VINYLES ===== -->
    <section class="shelf vin">
      <div class="shelf-head">
        <div class="title-row">
          <h2><span class="k">●</span> Vinyles</h2>
          <span class="big"><b id="vinOwned">0</b> disques · <span id="vinWish">0</span> recherchés<span id="vinValue"></span></span>
        </div>
        <div class="tools">
          <button class="primary" id="vinFindBtn">Rechercher un vinyle</button>
          <button id="vinPriceBtn" title="Met à jour le prix Discogs de tes vinyles">Actualiser les prix</button>
          <button id="vinManualBtn">Ajouter à la main</button>
        </div>
        <div class="tools">
          <input type="search" id="vinFilter" placeholder="Filtrer ma collection…" aria-label="Filtrer ma collection">
          <select id="vinSort" aria-label="Trier">
            <option value="artist">Par artiste</option>
            <option value="added">Derniers ajouts</option>
            <option value="year">Par année</option>
          </select>
          <div class="seg" id="vinView">
            <button data-v="all" aria-pressed="true">Tous</button>
            <button data-v="own">Ma collection</button>
            <button data-v="wish">Recherchés</button>
          </div>
        </div>
      </div>
      <div class="list" id="vinList"></div>
    </section>
  </main>

  <!-- Fenêtres -->
  <div class="overlay" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

  <script src="../shared/coffre-core.js"></script>
  <script src="fm-data.js"></script>
  <script src="app.js"></script>
  <script src="ygo.js"></script>
  <script src="op.js"></script>
</body>
</html>
