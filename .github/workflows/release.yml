# Compile Coffre pour Windows et Android, et publie les deux dans les Releases GitHub.
# Se lance tout seul quand tu pousses un tag de version (ex. v1.1.0),
# ou à la main depuis l'onglet Actions du repo (bouton "Run workflow").
name: Publier une version

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Compiler et publier
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Écrire les nouveautés sur la page de la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.js "$GITHUB_REF_NAME" > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

  build-android:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la clé de signature
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Il manque les secrets ANDROID_KEYSTORE et/ou ANDROID_KEYSTORE_PASSWORD (voir LISEZMOI.md, partie Android)."
            exit 1
          fi

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer le projet Android
        working-directory: mobile
        run: |
          npm install
          npm run android

      - name: Compiler l'APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signer l'APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS" | base64 -d > "$RUNNER_TEMP/coffre.jks"
          "$BT/zipalign" -p -f 4 mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/coffre.jks" --ks-key-alias coffre --ks-pass env:KS_PASS --key-pass env:KS_PASS --out Coffre-Android.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify Coffre-Android.apk
          rm "$RUNNER_TEMP/coffre.jks"

      - name: Garder une copie dans Actions
        uses: actions/upload-artifact@v4
        with:
          name: Coffre-Android
          path: Coffre-Android.apk

      - name: Ajouter l'APK à la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" Coffre-Android.apk --clobber
